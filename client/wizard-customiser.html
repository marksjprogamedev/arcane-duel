<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcane Duel — Wizard Workshop (Prototype)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1023;color:#f5f1df;font-family:system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#171b36;border-bottom:2px solid #525b82}
h1{font-size:clamp(19px,4vw,30px);margin:0}a{color:#cce5ff;text-decoration:none;border:1px solid #8296c2;padding:9px 14px;border-radius:8px}
main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.panel{border:2px solid #414c79;border-radius:13px;background:#191e3b;overflow:hidden}
h2{font-size:17px;margin:0;padding:14px;border-bottom:1px solid #414c79}
.preview{position:relative;min-height:440px;background:radial-gradient(ellipse at 50% 65%,#39486f,#151b35 70%);display:grid;place-items:center;overflow:hidden}
.preview:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#8e9ac01c 1px,transparent 1px),linear-gradient(90deg,#8e9ac01c 1px,transparent 1px);background-size:24px 24px}
#wizard{position:relative;width:256px;height:340px;image-rendering:pixelated;filter:drop-shadow(0 8px 1px #080c1d88)}
.part{position:absolute;image-rendering:pixelated;overflow:visible;transform-origin:center}
#feetL{left:74px;top:283px;width:55px;height:40px}#feetR{left:143px;top:283px;width:55px;height:40px}
#body{left:65px;top:153px;width:130px;height:140px}#head{left:60px;top:40px;width:140px;height:133px}
#hat{left:51px;top:0;width:157px;height:80px}
#staff{left:4px;top:98px;width:74px;height:206px}
#off{left:197px;top:176px;width:51px;height:80px}
#handL{left:47px;top:211px;width:41px;height:41px}
#handR{left:177px;top:211px;width:41px;height:41px}
.controls{padding:14px;display:flex;flex-wrap:wrap;gap:12px}
button{cursor:pointer;border:1px solid #7c91bd;border-radius:8px;background:#283963;color:white;font:inherit;padding:9px 12px}
button:focus-visible,a:focus-visible{outline:3px solid #7dd3fc}
fieldset{border:0;border-bottom:1px solid #38436c;padding:12px;margin:0}
legend{font-weight:750;padding:6px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:inline-flex;align-items:center;gap:6px;background:#283454;padding:9px;border:1px solid #58678e;border-radius:8px;cursor:pointer;font-size:13px}
.choice:has(input:checked){background:#24617e;border-color:#9ce6ff}
.choice input{accent-color:#63c4ed}
footer{padding:15px;color:#acb6d2;font-size:13px}
@keyframes leftFoot{50%{transform:translate(-10px,-10px) rotate(-8deg)}}@keyframes rightFoot{50%{transform:translate(10px,-10px) rotate(8deg)}}
@keyframes leftHand{50%{transform:translateY(-12px) rotate(-12deg)}}@keyframes rightHand{50%{transform:translateY(10px) rotate(12deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.walk #feetL{animation:leftFoot .5s infinite alternate}.walk #feetR{animation:rightFoot .5s infinite alternate}
.walk #handL{animation:leftHand .5s infinite alternate}.walk #handR{animation:rightHand .5s infinite alternate}
.walk #body,.walk #head,.walk #hat{animation:bob .5s infinite alternate}
@media(max-width:750px){main{grid-template-columns:1fr}.preview{min-height:390px}}
</style></head><body>
<header><h1>🧙 Wizard Workshop <small style="font-size:12px;color:#a9c5e6">EXPERIMENTAL</small></h1><a href="/">← Main menu</a></header>
<main><section class="panel"><h2>Your Wizard</h2><div class="preview"><div id="wizard" aria-label="Customisable pixel-art wizard">
<svg id="feetL" class="part" viewBox="0 0 16 12"></svg><svg id="feetR" class="part" viewBox="0 0 16 12"></svg>
<svg id="body" class="part" viewBox="0 0 32 34"></svg><svg id="head" class="part" viewBox="0 0 32 32"></svg>
<svg id="hat" class="part" viewBox="0 0 36 20"></svg><svg id="staff" class="part" viewBox="0 0 18 55"></svg>
<svg id="off" class="part" viewBox="0 0 20 28"></svg><svg id="handL" class="part" viewBox="0 0 12 12"></svg><svg id="handR" class="part" viewBox="0 0 12 12"></svg>
</div></div><div class="controls"><button id="walk" type="button">▶ Walk / Shuffle</button><button id="random" type="button">⚄ Randomise</button><button id="reset" type="button">↺ Reset</button></div>
<footer>Floating hands and feet animate independently. This is a visual sandbox only; nothing here changes your in-game character.</footer></section>
<section class="panel"><h2>Mix & Match</h2><div id="options"></div></section></main>
<script>
const sets={
head:['Cheerful','Grumpy','Surprised','Skeleton','Goblin'],
hat:['None','Blue hat','Red hat','Green hat','Purple hat','Crown'],
body:['Blue tunic','Red tunic','Green tunic','Purple tunic','Plain apprentice'],
staff:['Wooden staff','Crystal staff','Fire staff','No staff'],
off:['Empty','Spellbook','Orb','Shield'],
hands:['Skin','Gloves','Green'],
feet:['Brown boots','Red boots','Blue boots']
};
const defaults={head:0,hat:0,body:4,staff:0,off:0,hands:0,feet:0};let picked={...defaults};
const palette=['#3379cf','#c4444e','#38835b','#8051bd','#796a65'];
const ns='http://www.w3.org/2000/svg';
function rect(x,y,w,h,fill){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'"/>'}
function path(d,fill,stroke='#25233a',sw=1){return '<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linejoin="round"/>'}
function render(){
const h=picked.head,skin=h===3?'#e6dfc7':h===4?'#79a45e':'#f5b080';
const eyes=h===3?'#24263b':h===4?'#ffeb93':'#222338';
let face=path('M8 5H24V7H27V11H29V24H25V28H7V24H3V11H5V7H8Z',skin);
face+=rect(8,13,5,6,eyes)+rect(20,13,5,6,eyes)+rect(9,13,2,2,'#fff');
face+=h===0?path('M12 23H21V25H19V27H14V25H12Z','#763e46','none'):h===1?rect(12,24,9,2,'#763e46'):h===2?rect(15,23,4,5,'#733f4a'):h===3?rect(13,23,8,3,'#26283b'):path('M12 24H22V26H12Z','#58744d');
if(h===4)face+=path('M3 14H0V10H3M29 14H32V10H29',skin);
document.getElementById('head').innerHTML=face;
const c=palette[picked.body];let body=path('M9 2H23L29 10V30H3V10Z',c);
body+=path('M11 2L16 8L21 2','none','#e7ba65',2)+rect(15,9,2,19,'#dfb463')+rect(5,28,22,3,'#e4b86a');
document.getElementById('body').innerHTML=body;
const hats=['','#3379cf','#b73743','#358a58','#8050b5','#edb74d'];
document.getElementById('hat').innerHTML=picked.hat===0?'':picked.hat===5?path('M4 17L7 4L15 12L18 2L22 12L29 4L32 17Z',hats[5])+rect(4,17,28,3,'#d89433'):path('M6 15L14 4L24 2L29 15Z',hats[picked.hat])+rect(1,15,34,4,hats[picked.hat]);
const handColor=picked.hands===1?'#65538d':picked.hands===2?'#81a65d':skin;
const hand=path('M2 4H4V1H6V4H8V2H10V8H8V11H3V8H1V5H2Z',handColor);
document.getElementById('handL').innerHTML=hand;document.getElementById('handR').innerHTML=hand;
const boot=['#8d6047','#b43f46','#3979b3'][picked.feet];
const shoe=path('M4 1H12V6H15V10H1V7H4Z',boot);
document.getElementById('feetL').innerHTML=shoe;document.getElementById('feetR').innerHTML=shoe;
document.getElementById('staff').innerHTML=picked.staff===3?'':path('M8 12L11 12L10 54H7Z','#9a693d')+ (picked.staff===0?path('M9 15Q1 10 4 4Q9 -2 14 5Q15 9 10 10','none','#ad7846',3):picked.staff===1?path('M9 1L15 8L9 15L3 8Z','#6ad8ff'):path('M9 0L15 8L9 14L3 8Z','#ff8542'));
document.getElementById('off').innerHTML=picked.off===0?'':picked.off===1?path('M3 4H17V25H3Z','#7753a3')+rect(9,8,2,12,'#e3c077'):picked.off===2?'<circle cx="10" cy="14" r="9" fill="#54d9ff" stroke="#c1f8ff" stroke-width="2"/>':path('M10 2L18 6V16L10 25L2 16V6Z','#b2a16c');
}
function controls(){
const root=document.getElementById('options');root.innerHTML='';
for(const [key,values] of Object.entries(sets)){
const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=key==='off'?'Offhand':key==='staff'?'Main hand':key[0].toUpperCase()+key.slice(1);field.appendChild(legend);
const row=document.createElement('div');row.className='choices';
values.forEach((name,i)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name=key;input.value=i;input.checked=picked[key]===i;input.addEventListener('change',()=>{picked[key]=i;render()});label.append(input,document.createTextNode(name));row.appendChild(label)});field.appendChild(row);root.appendChild(field)
}}
document.getElementById('walk').addEventListener('click',()=>{const w=document.getElementById('wizard');w.classList.toggle('walk');document.getElementById('walk').textContent=w.classList.contains('walk')?'■ Stop walking':'▶ Walk / Shuffle'});
document.getElementById('random').addEventListener('click',()=>{for(const k of Object.keys(sets))picked[k]=Math.floor(Math.random()*sets[k].length);controls();render()});
document.getElementById('reset').addEventListener('click',()=>{picked={...defaults};controls();render()});
controls();render();
</script></body></html>
